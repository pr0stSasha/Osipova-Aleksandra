server:
  port: 8080

spring:
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=60s

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: "*"
        exclude: "shutdown"
  server:
    base-path: /admin

resilience4j:
  ratelimiter:
    instances:
      userController:
        limitForPeriod: 5
        limitRefreshPeriod: 10s
        timeoutDuration: 0
  circuitbreaker:
    instances:
      courseController:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    instances:
      universityController:
        timeoutDuration: 3s