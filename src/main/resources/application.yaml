server:
  port: 8080

spring:
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=60s

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: "*"
        exclude: "shutdown"
  server:
    base-path: /admin

resilience4j:
  ratelimiter:
    instances:
      defaultRateLimiter:
        limit-for-period: 5
        limit-refresh-period: 10s
        timeout-duration: 500ms
  circuitbreaker:
    instances:
      defaultCircuitBreaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10